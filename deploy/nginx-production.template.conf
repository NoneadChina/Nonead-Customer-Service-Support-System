# ============================================================
# NoneadCSS Production Nginx Config (Windows nginx/1.30.4)
# Deployment Topology:
#   nginx entry      :5173 (external)
#     ├─ Dynamic paths (/api /swagger /scalar /oauth /chatHub ...) → upstream backend 127.0.0.1:5009 (Kestrel)
#     └─ All other paths (SPA routes /assets)                 → upstream frontend 127.0.0.1:5172 (vite preview)
#
# Control:
# Replace <NGINX_PREFIX> with your local nginx install dir and <DEPLOY_DIR> with this deployment's directory.
#   Start : <NGINX_PREFIX>\nginx.exe -c <DEPLOY_DIR>/nginx.conf -p <NGINX_PREFIX>
#   Reload: <NGINX_PREFIX>\nginx.exe -s reload -c <DEPLOY_DIR>/nginx.conf -p <NGINX_PREFIX>
#   Stop  : <NGINX_PREFIX>\nginx.exe -s stop   -p <NGINX_PREFIX>
#   Quit  : <NGINX_PREFIX>\nginx.exe -s quit   -p <NGINX_PREFIX>
# Log/temp paths below are relative to the -p prefix on purpose, so no machine-specific absolute path is committed.
# ============================================================

worker_processes  1;   # Windows nginx supports only 1 worker

error_log  logs/nginx-error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------- Logging ----------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'up=$upstream_addr';

    access_log  logs/nginx-access.log  main;

    # ---------- Performance ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   75;
    keepalive_requests  1000;
    client_header_timeout  30s;
    client_body_timeout    30s;
    send_timeout           30s;
    reset_timedout_connection on;

    # ---------- Size limits (match Attachment:MaxSize=25MB + overhead) ----------
    client_max_body_size    30m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # ---------- Gzip ----------
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/csv
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---------- SignalR/WebSocket: map Upgrade → Connection (don't force "upgrade" on negotiate/SSE/LongPolling) ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- Temp dirs (scoped under Production/) ----------
    proxy_temp_path       cache/proxy;
    client_body_temp_path cache/client_body;
    fastcgi_temp_path     cache/fastcgi;
    uwsgi_temp_path       cache/uwsgi;
    scgi_temp_path        cache/scgi;

    # ---------- Upstreams ----------
    # Backend: ASP.NET Core Kestrel (single-file published to Production/backend/NoneadCSS.Api.exe)
    upstream backend {
        server 127.0.0.1:5009;
        keepalive 64;
    }
    # Frontend: Vite preview server (serves built SPA from frontend/dist)
    upstream frontend {
        server 127.0.0.1:5172;
        keepalive 32;
    }

    # ---------- Shared: proxy headers ----------
    proxy_http_version 1.1;
    #
    # NOTE: proxy_set_header splits between "frontend" (Vite preview :5172) and "backend" (Kestrel :5009).
    # Kestrel only listens on 127.0.0.1:5009 and validates the HTTP Host header; if we forward the
    # *external* Host (e.g. LAN-IP:5173 / DEV-HOST:5173 / LAN-IP:5173) coming from another machine
    # on the LAN, Kestrel rejects it with HTTP 400 "Invalid Hostname" and the app looks unreachable.
    # So for backend paths we send Host=127.0.0.1 (what Kestrel is actually bound to) and keep the
    # original client Host in X-Forwarded-Host so ASP.NET Core generates correct absolute redirects /
    # OAuth callback URLs via ForwardedHeaders middleware.
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    server {
        listen       5173 default_server;
        server_name  127.0.0.1 localhost _ LAN-IP DEV-HOST dev-host.example.com css.example.com css.example.com *.css.example.com;
        server_tokens off;
        charset      utf-8;

        # ---------- Security response headers (always ensures error codes also carry them) ----------
        add_header X-Content-Type-Options  nosniff                               always;
        add_header X-Frame-Options         SAMEORIGIN                            always;
        add_header Referrer-Policy         strict-origin-when-cross-origin       always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # ---------- Error page fallback (proxied to frontend) ----------
        error_page   500 502 503 504  /index.html;

        # ============================================================
        # 1) SignalR WebSocket Hubs: /hubs/notifications & /hubs/chat
        #    Backend routes (see Program.cs MapHub):
        #      /hubs/notifications  → NotificationHub  站内实时通知 / 日历广播
        #      /hubs/chat           → ChatHub          客户侧实时聊天 (sessionToken)
        #    Also /notificationHub, /chatHub  (old aliases for backward compat)
        #
        #    >>> DIAGNOSIS TEMPORARY FIX <<<
        #    Routing these through the same regex location as all other working API paths
        #    (/api, /health, etc.) so proxy settings are identical. The dedicated ^~ /hubs/
        #    prefix location was independently causing 400 "Invalid Hostname" on
        #    SignalR's POST /negotiate request. Upgrade/Connection headers for actual
        #    WebSocket handshakes are still applied: they are at server-level shared
        #    map ($connection_upgrade) and set via proxy_set_header in the http block
        #    already via Host/X-Real-IP/X-Forwarded-* shared headers.
        # ============================================================
        # location ^~ /hubs/ { ... }   # disabled; use regex location below

        # ============================================================
        # 2) Backend dynamic paths: all reverse-proxied to backend (:5009)
        #    Includes SignalR hubs (hubs/notifications hubs/chat chatHub notificationHub)
        #    API docs: /docs (Scalar entry), /openapi/* (OpenAPI JSON), /scalar/* (embedded assets)
        # ============================================================
        location ~ ^/(hubs/notifications|hubs/chat|chatHub|notificationHub|api|scalar|swagger|docs|openapi|oauth|attachments|track|realtime|\.well-known|setup|health) {
            proxy_pass              http://backend;
            proxy_connect_timeout   30s;
            # Use long timeouts (3600s) so SignalR WebSocket + Server-Sent Events transports
            # stay alive for 1h without Nginx cutting in mid-flight.
            proxy_send_timeout      3600s;
            proxy_read_timeout      3600s;

            # --- Standard forwarding headers (MANDATORY) ---
            # Nginx inheritance rule: ANY proxy_set_header at THIS level cancels ALL
            # inherited headers from http {}. So we must redeclare the shared ones.
            #
            # IMPORTANT: Host MUST be 127.0.0.1 when forwarding to Kestrel (backend :5009).
            # Otherwise another machine visiting us via LAN IP (e.g. LAN-IP:5173)
            # will have that external Host forwarded upstream, and Kestrel (binding only
            # 127.0.0.1:5009) answers HTTP 400 "Invalid Hostname" → app appears unreachable.
            # We still preserve the original client Host via X-Forwarded-Host so ASP.NET
            # Core ForwardedHeaders middleware can build correct public URLs / OAuth
            # redirects / 3xx Location headers.
            proxy_set_header   Host              127.0.0.1;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;

            # Only set Upgrade/Connection proxy headers when client actually requests an
            # upgrade (real WebSocket handshake). Sending empty-valued headers on the
            # initial SignalR POST /negotiate (no Upgrade header) caused upstream
            # "Invalid Hostname" rejections.
            set $up_hdr_upgrade    "";
            set $up_hdr_connection "";
            if ($http_upgrade != '') {
                set $up_hdr_upgrade    $http_upgrade;
                set $up_hdr_connection $connection_upgrade;
            }
            proxy_set_header Upgrade    $up_hdr_upgrade;
            proxy_set_header Connection $up_hdr_connection;

            # Rewrite Kestrel 3xx Location (e.g. OAuth jumps to internal port)
            proxy_redirect  ~^http://127\.0\.0\.1:5009/(.*)$  $scheme://$host/$1;

            # Buffering ON is fine for REST APIs; SignalR negotiate is a short JSON
            # response so buffering does not hurt. Streaming transports (WS/SSE)
            # bypass buffer due to Upgrade handshake semantics.
            proxy_buffering    on;
            proxy_buffer_size  8k;
            proxy_buffers      16  8k;
            proxy_busy_buffers_size 16k;
        }

        # ============================================================
        # 3) Customer chat widget: allow specific parent sites to iframe via CSP frame-ancestors
        #    - NOTE: add_header at location level overrides server level, so redeclare other security headers
        # ============================================================
        location /chat/widget {
            # Remove X-Frame-Options; let CSP frame-ancestors control it (modern browsers prefer CSP)
            add_header X-Content-Type-Options  nosniff                               always;
            add_header Referrer-Policy         strict-origin-when-cross-origin       always;
            add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "frame-ancestors 'self' http://www.example.com http://example.com https://www.nonead.com https://nonead.com;" always;

            proxy_pass http://frontend;
        }

        # ============================================================
        # 4) /assets/ — static hashed assets: aggressive caching via frontend
        # ============================================================
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            proxy_pass http://frontend;
        }

        # ============================================================
        # 5) All other paths: reverse-proxy to frontend (vite preview :5172)
        #    Vite preview handles SPA fallback internally.
        #    Forward original Host (not 127.0.0.1); Vite doesn't validate Host, and
        #    absolute URLs inside SPA assets should reflect the public host if any.
        # ============================================================
        location / {
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_pass http://frontend;
        }
    }
}
