# ============================================================
# NoneadCSS 生产入口 Nginx 配置（Windows nginx/1.30.4）
# 部署拓扑：
#   nginx 统一入口   :5173 (监听外部)
#     ├─ 动态路径（/api /swagger /scalar /oauth /chatHub ...） → upstream backend  127.0.0.1:5009  (Kestrel)
#     └─ 其他所有路径（/ /assets SPA 路由 ...）               → upstream frontend 127.0.0.1:5172  (vite preview，已构建 dist)
#
# 启停：
# 用法（把 <NGINX_PREFIX> 换成本机 nginx 安装目录，<REPO> 换成本仓库检出目录）：
#   启动 : <NGINX_PREFIX>\nginx.exe -c <REPO>/deploy/nginx.conf -p <NGINX_PREFIX>
#   重启 : <NGINX_PREFIX>\nginx.exe -s reload -p <NGINX_PREFIX>
#   停止 : <NGINX_PREFIX>\nginx.exe -s stop   -p <NGINX_PREFIX>
#   退出 : <NGINX_PREFIX>\nginx.exe -s quit   -p <NGINX_PREFIX>
# 说明：本文件里的日志/临时目录一律写成相对路径，nginx 会相对 -p 指定的 prefix 解析，
#       因此不需要（也不应该）把某台机器的绝对路径写进版本库。
# ============================================================

worker_processes  1;   # Windows 版 nginx 仅支持 1 个 worker 进程

error_log  logs/nginx-error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------- Logging ----------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'up=$upstream_addr';

    access_log  logs/nginx-access.log  main;

    # ---------- 性能 ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   75;
    keepalive_requests  1000;
    client_header_timeout  30s;
    client_body_timeout    30s;
    send_timeout           30s;
    reset_timedout_connection on;

    # ---------- 大小限制（匹配后端 Attachment:MaxSize=25MB，留 overhead） ----------
    client_max_body_size    30m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # ---------- Gzip（入口级压缩，对反代响应同样生效） ----------
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/csv
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---------- SignalR/WebSocket: map Upgrade → Connection (negotiate/SSE/LongPolling 不应强制 upgrade) ----------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- 临时目录（避免写入 nginx 安装目录，便于权限收敛） ----------
    proxy_temp_path       cache/proxy;
    client_body_temp_path cache/client_body;
    fastcgi_temp_path     cache/fastcgi;
    uwsgi_temp_path       cache/uwsgi;
    scgi_temp_path        cache/scgi;

    # ---------- Upstreams ----------
    # 后端：ASP.NET Core Kestrel（生产打包 publish/NoneadCSS.Api.dll）
    upstream backend {
        server 127.0.0.1:5009;
        keepalive 64;
    }
    # 前端：vite preview（生产打包 frontend/dist，preview 已处理 SPA fallback / 预压缩 / content-type）
    upstream frontend {
        server 127.0.0.1:5172;
        keepalive 32;
    }

    # ---------- 共享：反代头 ----------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;

    server {
        listen       5173;
        server_name  127.0.0.1 localhost css.example.com *.css.example.com;
        server_tokens off;
        charset      utf-8;

        # ---------- 安全响应头（always 保证错误码也带） ----------
        add_header X-Content-Type-Options  nosniff                               always;
        add_header X-Frame-Options         SAMEORIGIN                            always;
        add_header Referrer-Policy         strict-origin-when-cross-origin       always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # ---------- 错误页兜底（走前端，避免裸错误） ----------
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            internal;
            proxy_pass  http://frontend/;
        }

        # ============================================================
        # 1) SignalR WebSocket Hubs: /hubs/notifications & /hubs/chat
        #    Backend routes (see Program.cs MapHub):
        #      /hubs/notifications  → NotificationHub  站内实时通知 / 日历广播
        #      /hubs/chat           → ChatHub          客户侧实时聊天 (sessionToken)
        #    Also /notificationHub, /chatHub  (old aliases for backward compat)
        #
        #    Routing through the same regex location as all other working API paths
        #    (/api, /health, etc.) so proxy settings are identical. The dedicated ^~ /hubs/
        #    prefix location independently caused 400 "Invalid Hostname" because using
        #    proxy_set_header at location level cancels ALL inherited http-level
        #    forwarding headers (Host/X-Real-IP/X-Forwarded-*).
        # ============================================================
        # location ^~ /hubs/ { ... }              # disabled; use regex location below
        # location ~ ^/(chatHub|notificationHub)$ # disabled; merged into regex below

        # ============================================================
        # 2) 后端动态路径：全部反代到 backend(5009)
        #    - SignalR hubs (hubs/notifications hubs/chat chatHub notificationHub)
        #    - API / Swagger / Scalar 文档（/docs 前端入口、/openapi/* OpenAPI JSON、/scalar/* 内嵌资源）
        #    - OAuth/OIDC 登录回跳
        #    - 附件下载 / 追踪像素
        #    - Setup 初始化 / Healthz 健康检查
        # ============================================================
        location ~ ^/(hubs/notifications|hubs/chat|chatHub|notificationHub|api|scalar|swagger|docs|openapi|oauth|attachments|track|realtime|\.well-known|setup|health)(/|$) {
            proxy_pass              http://backend;
            proxy_connect_timeout   30s;
            # SignalR WS/SSE/SignalR 长连接保活（1h），避免被 Nginx 中途切断
            proxy_send_timeout      3600s;
            proxy_read_timeout      3600s;

            # --- Standard forwarding headers (MANDATORY) ---
            # Nginx inheritance rule: ANY proxy_set_header at THIS level cancels ALL
            # inherited headers from http {}. So we must redeclare the shared ones.
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;

            # Only set Upgrade/Connection proxy headers when client actually requests an
            # upgrade (real WebSocket handshake). Sending empty-valued headers on the
            # initial SignalR POST /negotiate (no Upgrade header) caused upstream
            # "Invalid Hostname" rejections.
            set $up_hdr_upgrade    "";
            set $up_hdr_connection "";
            if ($http_upgrade != '') {
                set $up_hdr_upgrade    $http_upgrade;
                set $up_hdr_connection $connection_upgrade;
            }
            proxy_set_header Upgrade    $up_hdr_upgrade;
            proxy_set_header Connection $up_hdr_connection;

            # 允许 Kestrel 3xx Location 重写（比如 OAuth 回跳内部端口）
            proxy_redirect  ~^http://127\.0\.0\.1:5009/(.*)$  $scheme://$host/$1;

            # Buffering ON is fine for REST APIs; SignalR negotiate is a short JSON
            # response so buffering does not hurt. Streaming transports (WS/SSE)
            # bypass buffer due to Upgrade handshake semantics.
            proxy_buffering    on;
            proxy_buffer_size  8k;
            proxy_buffers      16  8k;
            proxy_busy_buffers_size 16k;
        }

        # ============================================================
        # 3) 客户侧聊天 Widget：允许指定父站通过 iframe 嵌入
        #    - 用 CSP frame-ancestors 精确白名单替代全局 X-Frame-Options
        #    - location 级 add_header 会覆盖 server 级，需重声明其余安全头
        # ============================================================
        location /chat/widget {
            # 不设置 X-Frame-Options，由 CSP frame-ancestors 接管（现代浏览器优先 CSP）
            add_header X-Content-Type-Options  nosniff                               always;
            add_header Referrer-Policy         strict-origin-when-cross-origin       always;
            add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "frame-ancestors 'self' http://www.example.com http://example.com https://www.nonead.com https://nonead.com;" always;

            proxy_pass              http://frontend;
            proxy_connect_timeout   10s;
            proxy_send_timeout      60s;
            proxy_read_timeout      60s;
        }

        # ============================================================
        # 4) 其他所有路径：全部走 frontend(5173)
        #    - vite preview 内部已处理：
        #      · SPA 路由（try_files /index.html）
        #      · /assets/* 长缓存 + 预压缩 .gz（我们通过 gzip_static 在入口也能补）
        #      · 正确的 Content-Type
        # ============================================================
        location / {
            proxy_pass              http://frontend;
            proxy_connect_timeout   10s;
            proxy_send_timeout      60s;
            proxy_read_timeout      60s;

            # 让 Vite 返回的 Cache-Control 原样传递；针对 assets 额外做一层强缓存保险
            # （Vite preview 对 /assets/* 默认已设 immutable，这里只对浏览器暴露头保留）
        }
    }
}
